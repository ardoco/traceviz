version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "11:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "Dependency"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "11:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "Dependency"
      include: "scope"
    ignore:
      # TypeScript 7 has no JS compiler API; typescript-eslint supports only <6.1.0
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Must match the Node.js version of the VS Code runtime
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Must not exceed engines.vscode; bump both together by hand
      - dependency-name: "@types/vscode"
